name: Deploy Firestore (rules + indexes)

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write

concurrency:
  group: firestore-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy_firestore:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/363110423518/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: github-deployer@ai-workout-generator-hub.iam.gserviceaccount.com

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Deploy Firestore rules
        run: npx firebase deploy --only firestore:rules --project ai-workout-generator-hub

      - name: Deploy Firestore indexes
        run: npx firebase deploy --only firestore:indexes --project ai-workout-generator-hub
